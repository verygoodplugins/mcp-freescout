# Release Please - Automated versioning and dual-registry publishing
#
# How it works:
# 1. Every push to main with conventional commits updates a "Release PR"
# 2. When you merge the Release PR, it:
#    - Updates version in package.json
#    - Updates CHANGELOG.md
#    - Creates a GitHub Release with tag
#    - Triggers npm publish (primary) + GitHub Packages publish (mirror)
#
# Commit message format:
#   feat: add new feature          → minor version bump
#   fix: fix a bug                 → patch version bump
#   feat!: breaking change         → major version bump
#   chore/docs: no version bump
#
# npm Publishing (primary install path):
#   Uses Trusted Publishing (OIDC) - no NPM_TOKEN needed.
#   Requires Node 24+ for npm 11.5.1+ OIDC support.
#   Configure at: https://www.npmjs.com/package/@verygoodplugins/<package-name>/access
#
# GitHub Packages (org mirror):
#   Same package/version published to npm.pkg.github.com using GITHUB_TOKEN.
#   The mirror rebuilds from source in a separate job, so the tarball is not
#   guaranteed to be byte-identical to the npmjs.com one.
#   Mirror only — npmjs stays the default install path because GH Packages
#   requires a PAT with read:packages even for public packages.
#   Failures here do NOT fail the release (continue-on-error).
#
# RELEASE_PLEASE_TOKEN:
#   Uses org-level PAT so the Release PR triggers CI workflows.
#   PRs created by GITHUB_TOKEN don't trigger other workflows (GitHub security).

name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        id: release
        with:
          manifest-file: '.release-please-manifest.json'
          config-file: 'release-please-config.json'
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  npm-publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

      # Trusted Publishing: No NPM_TOKEN needed!
      - run: npm publish --provenance --access public

  gh-packages-publish:
    needs: [release-please, npm-publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@verygoodplugins'

      - run: npm install -g npm@11.19.0
      - run: npm ci --ignore-scripts
      - run: npm run build

      # GitHub Packages auth uses GITHUB_TOKEN; no provenance support there.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mcp-registry-publish:
    needs: [release-please, npm-publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install pinned MCP Registry publisher
        run: |
          publisher_archive="$RUNNER_TEMP/mcp-publisher_linux_amd64.tar.gz"
          publisher_dir="$RUNNER_TEMP/mcp-publisher-v1.8.1"
          curl --fail --show-error --silent --location \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" \
            --output "$publisher_archive"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $publisher_archive" | sha256sum --check --status -
          mkdir -p "$publisher_dir"
          tar --extract --gzip --file "$publisher_archive" --directory "$publisher_dir"
          test -x "$publisher_dir/mcp-publisher"
          echo "$publisher_dir" >> "$GITHUB_PATH"

      - name: Publish to MCP Registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish
        env:
          MCP_REGISTRY_URL: https://registry.modelcontextprotocol.io
